name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
      # glycin isolates its image loaders with bubblewrap, which needs
      # namespaces that unprivileged containers do not allow. The tests run
      # here instead of in the Flatpak build, where glycin cannot sandbox.
      options: --privileged
    steps:
      - name: Install dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git gcc meson vala gettext desktop-file-utils appstream
          gtk4-devel libadwaita-devel gdk-pixbuf2-devel libwebp-devel libgexiv2-devel
          glycin-loaders bubblewrap

      - name: Check out
        uses: actions/checkout@v4

      - name: Configure
        run: meson setup _build

      - name: Build
        run: ninja -C _build

      - name: Test
        run: meson test -C _build --print-errorlogs

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: io.github.dprietob.redux.flatpak
          manifest-path: io.github.dprietob.redux.yaml
          cache-key: flatpak-builder-${{ github.sha }}
